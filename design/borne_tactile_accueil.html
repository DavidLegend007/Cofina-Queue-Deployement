<script>
        // Simple script to update kiosk time
        function updateTime() {
            const now = new Date();
            const timeElement = document.getElementById('kiosk-time');
            const dateElement = document.getElementById('kiosk-date');
            
            if (timeElement) {
                timeElement.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            }
            if (dateElement) {
                dateElement.textContent = now.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
            }
        }
        
        setInterval(updateTime, 60000); // Update every minute
        updateTime(); // Initial call
    </script>
